name: Update report index

on:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - 'scripts/update_report_index.py'
  workflow_dispatch:

jobs:
  update-report-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate report index
        run: python action_update_index.py

      - name: Commit updated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update report index'
          file_pattern: REPORT_INDEX.md
